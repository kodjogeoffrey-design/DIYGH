<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFB800" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121212" stop-opacity="0"/>
      <stop offset="1" stop-color="#121212" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#121212"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- Dev board -->
  <g transform="translate(150 180)">
    <rect x="0" y="0" width="480" height="320" rx="14" fill="#0E3B2E" stroke="#00E676" stroke-width="4"/>
    <g stroke="#C0C0C0" stroke-width="8" stroke-linecap="round">
      <line x1="40" y1="24" x2="40" y2="8"/><line x1="90" y1="24" x2="90" y2="8"/>
      <line x1="140" y1="24" x2="140" y2="8"/><line x1="190" y1="24" x2="190" y2="8"/>
      <line x1="240" y1="24" x2="240" y2="8"/><line x1="290" y1="24" x2="290" y2="8"/>
      <line x1="340" y1="24" x2="340" y2="8"/><line x1="390" y1="24" x2="390" y2="8"/>
      <line x1="440" y1="24" x2="440" y2="8"/>
      <line x1="40" y1="296" x2="40" y2="312"/><line x1="90" y1="296" x2="90" y2="312"/>
      <line x1="140" y1="296" x2="140" y2="312"/><line x1="190" y1="296" x2="190" y2="312"/>
      <line x1="240" y1="296" x2="240" y2="312"/><line x1="290" y1="296" x2="290" y2="312"/>
      <line x1="340" y1="296" x2="340" y2="312"/><line x1="390" y1="296" x2="390" y2="312"/>
      <line x1="440" y1="296" x2="440" y2="312"/>
    </g>
    <rect x="40" y="110" width="110" height="70" rx="6" fill="#1A1A1A" stroke="#9BA1A6" stroke-width="3"/>
    <rect x="46" y="128" width="40" height="34" rx="3" fill="#6B7280"/>
    <rect x="200" y="90" width="130" height="130" rx="8" fill="#1A1A1A" stroke="#FFB800" stroke-width="3"/>
    <circle cx="216" cy="106" r="7" fill="#FFB800"/>
    <g stroke="#FFB800" stroke-width="2" stroke-opacity="0.7">
      <line x1="200" y1="120" x2="150" y2="120"/><line x1="200" y1="150" x2="150" y2="150"/>
      <line x1="200" y1="180" x2="150" y2="180"/><line x1="330" y1="120" x2="380" y2="120"/>
      <line x1="330" y1="150" x2="380" y2="150"/><line x1="330" y1="180" x2="380" y2="180"/>
    </g>
    <circle cx="390" cy="240" r="14" fill="#FFB800"/>
    <circle cx="430" cy="240" r="14" fill="#00E676"/>
    <text x="240" y="270" text-anchor="middle" fill="#8FE9C5" font-family="monospace" font-size="22" letter-spacing="4">CONTROLLER</text>
  </g>

  <!-- Ultrasonic sensor -->
  <g transform="translate(720 160)">
    <rect x="0" y="0" width="300" height="170" rx="10" fill="#123A5C" stroke="#4CC9F0" stroke-width="4"/>
    <circle cx="90" cy="75" r="48" fill="#1A1A1A" stroke="#9BA1A6" stroke-width="5"/>
    <circle cx="90" cy="75" r="30" fill="#2B2B2B"/>
    <circle cx="90" cy="75" r="16" fill="#4CC9F0" fill-opacity="0.35"/>
    <circle cx="210" cy="75" r="48" fill="#1A1A1A" stroke="#9BA1A6" stroke-width="5"/>
    <circle cx="210" cy="75" r="30" fill="#2B2B2B"/>
    <circle cx="210" cy="75" r="16" fill="#4CC9F0" fill-opacity="0.35"/>
    <text x="150" y="150" text-anchor="middle" fill="#8FD9F4" font-family="monospace" font-size="18" letter-spacing="3">RANGE SENSOR</text>
  </g>

  <!-- Servo -->
  <g transform="translate(760 420)">
    <rect x="0" y="30" width="230" height="150" rx="10" fill="#1C2A3F" stroke="#FF7A45" stroke-width="4"/>
    <rect x="-30" y="55" width="60" height="26" rx="6" fill="#2B2B2F" stroke="#FF7A45" stroke-width="3"/>
    <circle cx="0" cy="68" r="16" fill="#FF7A45"/>
    <rect x="70" y="-10" width="90" height="46" rx="8" fill="#2B2B2F" stroke="#FF7A45" stroke-width="3"/>
    <rect x="98" y="-46" width="34" height="44" rx="4" fill="#3A3A3E"/>
    <text x="115" y="140" text-anchor="middle" fill="#FFB59A" font-family="monospace" font-size="18" letter-spacing="3">SERVO 180°</text>
  </g>

  <!-- Jumper wire arcs -->
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M640 560 C 560 660, 420 640, 340 560" stroke="#FFB800"/>
    <path d="M660 590 C 600 700, 440 700, 360 600" stroke="#00E676"/>
    <path d="M620 600 C 520 720, 380 720, 300 620" stroke="#4CC9F0"/>
  </g>
  <g fill="#E8E8E8">
    <rect x="330" y="548" width="22" height="26" rx="3"/>
    <rect x="350" y="588" width="22" height="26" rx="3"/>
    <rect x="290" y="608" width="22" height="26" rx="3"/>
  </g>

  <!-- Breadboard -->
  <g transform="translate(150 620)">
    <rect x="0" y="0" width="420" height="150" rx="8" fill="#EDEDED" stroke="#9BA1A6" stroke-width="3"/>
    <g fill="#8A8A8A">
      <circle cx="40" cy="35" r="3"/><circle cx="70" cy="35" r="3"/><circle cx="100" cy="35" r="3"/>
      <circle cx="130" cy="35" r="3"/><circle cx="160" cy="35" r="3"/><circle cx="190" cy="35" r="3"/>
      <circle cx="220" cy="35" r="3"/><circle cx="250" cy="35" r="3"/><circle cx="280" cy="35" r="3"/>
      <circle cx="310" cy="35" r="3"/><circle cx="340" cy="35" r="3"/><circle cx="370" cy="35" r="3"/>
      <circle cx="40" cy="75" r="3"/><circle cx="70" cy="75" r="3"/><circle cx="100" cy="75" r="3"/>
      <circle cx="130" cy="75" r="3"/><circle cx="160" cy="75" r="3"/><circle cx="190" cy="75" r="3"/>
      <circle cx="220" cy="75" r="3"/><circle cx="250" cy="75" r="3"/><circle cx="280" cy="75" r="3"/>
      <circle cx="310" cy="75" r="3"/><circle cx="340" cy="75" r="3"/><circle cx="370" cy="75" r="3"/>
      <circle cx="40" cy="115" r="3"/><circle cx="70" cy="115" r="3"/><circle cx="100" cy="115" r="3"/>
      <circle cx="130" cy="115" r="3"/><circle cx="160" cy="115" r="3"/><circle cx="190" cy="115" r="3"/>
      <circle cx="220" cy="115" r="3"/><circle cx="250" cy="115" r="3"/><circle cx="280" cy="115" r="3"/>
      <circle cx="310" cy="115" r="3"/><circle cx="340" cy="115" r="3"/><circle cx="370" cy="115" r="3"/>
    </g>
    <line x1="0" y1="75" x2="420" y2="75" stroke="#C9C9C9" stroke-width="4"/>
    <rect x="20" y="18" width="380" height="8" fill="#E05555" fill-opacity="0.55"/>
    <rect x="20" y="124" width="380" height="8" fill="#4C8FE0" fill-opacity="0.55"/>
    <text x="210" y="80" text-anchor="middle" fill="#555" font-family="monospace" font-size="16" letter-spacing="4">PROTO</text>
  </g>

  <!-- Corner brackets -->
  <g stroke="#FFB800" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M40 80 V40 H80"/><path d="M1120 80 V40 H1080"/>
    <path d="M40 820 V860 H80"/><path d="M1120 820 V860 H1080"/>
  </g>

  <rect width="1200" height="900" fill="url(#fade)"/>
  <text x="600" y="60" text-anchor="middle" fill="#8A8A8A" font-family="monospace" font-size="20" letter-spacing="8">ROBOHUB · BUILD KIT · VER 2.4</text>
</svg>
